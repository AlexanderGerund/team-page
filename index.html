<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team</title>
  <style>
    :root {
      --wall: #161616;
      --blur: 0px;
      --reveal: 250ms;
      --fast: 200ms;
      --gap: 8px;
      --col-min: 148px;
      --cols: 5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--wall);
      color: #f2f2f2;
    }

    body {
      padding: clamp(8px, 1.4vw, 18px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .team {
      --gaps: calc((var(--cols) - 1) * var(--gap));
      --col-max: calc((100% - var(--gaps)) / var(--cols));
      display: grid;
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
      gap: var(--gap);
      grid-template-columns: repeat(auto-fill, minmax(max(var(--col-min), var(--col-max)), 1fr));
    }

    .team > li { min-width: 0; }

    .card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      padding: 0;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: #222;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .card:focus { outline: none; }

    .card:focus-visible {
      outline: 2px solid #f2f2f2;
      outline-offset: 3px;
    }

    .frame,
    .portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    .frame {
      opacity: 0;
      filter: blur(var(--blur));
    }

    .card.is-live .frame {
      transition:
        opacity calc(var(--swap, var(--fast)) * 0.62) linear,
        filter calc(var(--swap, var(--fast)) * 0.62) ease-out;
    }

    .frame.is-on {
      opacity: 1;
      filter: blur(0);
    }

    .portrait {
      z-index: 2;
      opacity: 0;
      filter: blur(var(--blur));
      transition: opacity var(--reveal) ease, filter var(--reveal) ease;
    }

    .card.is-revealed .frame {
      opacity: 0;
      filter: blur(var(--blur));
      transition: opacity var(--reveal) ease, filter var(--reveal) ease;
    }

    .card.is-revealed .portrait {
      opacity: 1;
      filter: blur(0);
    }

    .hud {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      font: 13px/1.35 ui-sans-serif, system-ui, sans-serif;
      color: #f2f2f2;
    }

    .hud-panel {
      width: min(280px, calc(100vw - 28px));
      padding: 14px;
      background: #161616;
      border: 1px solid #3a3a3a;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .hud-panel[hidden] { display: none; }

    .hud-field {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      align-items: center;
    }

    .hud-field input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      margin: 0;
      accent-color: #f2f2f2;
    }

    .hud-value {
      font-variant-numeric: tabular-nums;
      color: #f2f2f2;
    }

    .hud-logic {
      margin: 14px 0 0;
      padding: 0;
      border: 0;
    }

    .hud-logic legend {
      padding: 0;
      margin-bottom: 8px;
      color: #c8c8c8;
    }

    .hud-logic label {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 0 0 8px;
      cursor: pointer;
    }

    .hud-logic label:last-child { margin-bottom: 0; }

    .hud-logic input { margin-top: 2px; accent-color: #f2f2f2; }

    .hud-toggle {
      border: 1px solid #3a3a3a;
      background: #161616;
      color: #f2f2f2;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    .hud-toggle:focus-visible,
    .hud-panel input:focus-visible {
      outline: 2px solid #f2f2f2;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .frame { display: none; }
      .portrait,
      .card.is-revealed .portrait {
        opacity: 1;
        filter: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Team</h1>
  <ul class="team" id="team"></ul>
  <div class="hud">
    <div class="hud-panel" id="hud-panel" hidden>
      <label class="hud-field">
        <span>Blur transition</span>
        <span class="hud-value" id="blur-readout">0px</span>
        <input id="blur-control" type="range" min="0" max="40" step="1" value="0" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0">
      </label>
      <fieldset class="hud-logic">
        <legend>Logic</legend>
        <label>
          <input type="radio" name="logic" value="land" checked>
          <span>One random blur, then run to the portrait</span>
        </label>
        <label>
          <input type="radio" name="logic" value="play">
          <span>Portrait first, blur sequence on hover</span>
        </label>
        <label>
          <input type="radio" name="logic" value="reveal">
          <span>Blur sequence, then reveal the portrait</span>
        </label>
      </fieldset>
    </div>
    <button class="hud-toggle" id="hud-toggle" type="button" aria-expanded="false" aria-controls="hud-panel">Controls</button>
  </div>
  <script>
    const FAST = 200;
    const LAND_BUDGET = 460;
    const SLOW = [260, 420, 680];
    const BLUR_W = 960;
    const PORTRAIT_W = 1400;

    const settings = { blur: 0, logic: "land" };
    const blurForLogic = { land: 0, play: 14, reveal: 0 };

    // Primary still is portrait.jpg. Some folders spell that file portait.jpg.
    const PEOPLE = [
      ["Alex", "alex", "portrait.jpg", 8],
      ["Alica", "alica", "portait.jpg", 6],
      ["Chiara", "chiara", "portrait.jpg", 14],
      ["Esa", "esa", "portrait.jpg", 10],
      ["Jesus", "jesus", "portrait.jpg", 12],
      ["Mantas", "mantas", "portrait.jpg", 9],
      ["Marion", "marion", "portait.jpg", 13],
      ["Milan B", "milan_b", "portait.jpg", 16],
      ["Milan V", "milan_v", "portait.jpg", 13],
    ];

    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
    const team = document.getElementById("team");
    const cards = [];

    function makeImg(className) {
      const img = document.createElement("img");
      img.className = className;
      img.alt = "";
      img.draggable = false;
      img.decoding = "async";
      return img;
    }

    function assign(img, url) {
      if (url && img.getAttribute("src") !== url) img.setAttribute("src", url);
    }

    function later(card, delay, fn) {
      clearTimeout(card.timer);
      card.timer = setTimeout(fn, delay);
    }

    function stop(card) {
      clearTimeout(card.timer);
      card.timer = 0;
    }

    function warm(card, index) {
      const frame = card.frames[index % card.frames.length];
      if (!frame?.url || card.warmed === frame.url) return;
      card.warmed = frame.url;
      const img = new Image();
      img.decoding = "async";
      img.src = frame.url;
      card.warmer = img;
    }

    function showFrame(card, index) {
      const frame = card.frames[index];
      const incoming = card.layers[1 - card.front];
      const outgoing = card.layers[card.front];
      assign(incoming, frame.url);
      incoming.classList.remove("is-on");
      void incoming.offsetWidth;
      incoming.classList.add("is-on");
      outgoing.classList.remove("is-on");
      card.front = 1 - card.front;
      card.index = index;
      warm(card, index + 1);
    }

    function snapFrame(card, index) {
      const frame = card.frames[index];
      if (!frame?.url) return false;
      card.root.classList.remove("is-live");
      assign(card.layers[0], frame.url);
      card.layers[0].classList.add("is-on");
      card.layers[1].classList.remove("is-on");
      card.front = 0;
      card.index = index;
      warm(card, index + 1);
      requestAnimationFrame(() => card.root.classList.add("is-live"));
      return true;
    }

    function showPortrait(card) {
      assign(card.portrait, card.portraitReady || card.portraitSrc);
      card.mode = "revealed";
      card.root.classList.add("is-revealed");
      card.root.setAttribute("aria-pressed", "true");
    }

    function hidePortrait(card) {
      card.root.classList.remove("is-revealed");
      card.root.setAttribute("aria-pressed", "false");
    }

    function isIdle(card) {
      if (settings.logic === "play") return card.mode === "revealed";
      if (settings.logic === "land") return card.mode === "holding";
      return card.mode === "fast";
    }

    function step(card) {
      if (card.paused || card.mode === "revealed" || card.mode === "holding" || settings.logic === "land") return;

      const nextIndex = (card.index + 1) % card.frames.length;
      if (!card.frames[nextIndex].url) {
        later(card, 40, () => step(card));
        return;
      }

      let delay = FAST;
      if (settings.logic === "reveal" && card.mode === "slowing") {
        if (card.slowStep >= SLOW.length) {
          showPortrait(card);
          return;
        }
        delay = SLOW[card.slowStep++];
      }

      card.root.style.setProperty("--swap", delay + "ms");
      showFrame(card, nextIndex);
      later(card, delay, () => step(card));
    }

    function queueLand(card) {
      if (card.paused || card.mode !== "running" || settings.logic !== "land") return;
      const count = card.frames.length;
      if (card.landCursor >= count) {
        later(card, Math.max(0, card.landStart + LAND_BUDGET - performance.now()), () => {
          if (card.mode === "running" && settings.logic === "land") showPortrait(card);
        });
        return;
      }
      const when = card.landStart + Math.round((card.landCursor * LAND_BUDGET) / count);
      later(card, Math.max(0, when - performance.now()), () => advanceLand(card));
    }

    function advanceLand(card) {
      if (card.paused || card.mode !== "running" || settings.logic !== "land") return;
      const count = card.frames.length;
      if (card.landCursor >= count || performance.now() >= card.landStart + LAND_BUDGET) {
        showPortrait(card);
        return;
      }
      const nextIndex = (card.index + 1) % count;
      if (!card.frames[nextIndex].url) {
        if (performance.now() >= card.landStart + LAND_BUDGET) showPortrait(card);
        else later(card, 16, () => advanceLand(card));
        return;
      }
      card.root.style.setProperty("--swap", Math.max(16, Math.round(LAND_BUDGET / count)) + "ms");
      showFrame(card, nextIndex);
      card.landCursor += 1;
      queueLand(card);
    }

    function ensureCycle(card, stagger) {
      if (card.paused) return;
      if (card.mode !== "fast" && card.mode !== "running" && card.mode !== "slowing") return;
      if (!card.frames[card.index]?.url) {
        const fallback = card.frames.findIndex((frame) => frame.url);
        if (fallback >= 0) card.index = fallback;
        else {
          later(card, 40, () => ensureCycle(card, stagger));
          return;
        }
      }
      if (!card.layers[card.front].getAttribute("src")) snapFrame(card, card.index);
      if (!card.timer) {
        const delay = stagger ? FAST - ((card.order * 53) % (FAST - 30)) : FAST;
        later(card, delay, () => step(card));
      }
    }

    function enterIdle(card) {
      stop(card);
      card.slowStep = 0;
      card.remaining = 0;
      if (reduceMotion || settings.logic === "play") {
        showPortrait(card);
        return;
      }
      hidePortrait(card);
      if (settings.logic === "land") {
        card.mode = "holding";
        card.index = card.hold;
        if (card.frames[card.hold]?.url) snapFrame(card, card.hold);
        return;
      }
      card.mode = "fast";
      ensureCycle(card, true);
    }

    function engage(card) {
      if (reduceMotion || !isIdle(card)) return;
      if (settings.logic === "reveal") {
        card.mode = "slowing";
        card.slowStep = 0;
        return;
      }
      if (settings.logic === "play") {
        card.mode = "running";
        hidePortrait(card);
        ensureCycle(card, false);
        return;
      }
      card.mode = "running";
      card.landCursor = 0;
      card.landStart = performance.now();
      queueLand(card);
    }

    function dismiss(card) {
      if (reduceMotion || isIdle(card)) return;
      if (settings.logic === "reveal") {
        card.mode = "fast";
        card.slowStep = 0;
        hidePortrait(card);
        card.root.style.setProperty("--swap", FAST + "ms");
        if (!card.paused) later(card, FAST, () => step(card));
        return;
      }
      enterIdle(card);
    }

    function toggle(card) {
      if (isIdle(card)) engage(card);
      else dismiss(card);
    }

    function bind(card) {
      const button = card.root;
      if (reduceMotion) return;
      let lastTouch = 0;
      const fromTouch = () => performance.now() - lastTouch < 800;

      button.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") lastTouch = performance.now();
      });
      button.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "touch" || fromTouch()) return;
        engage(card);
      });
      button.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "touch" || fromTouch()) return;
        if (button.matches(":focus-visible")) return;
        dismiss(card);
      });
      button.addEventListener("click", (event) => {
        if (fromTouch() || (!canHover && event.detail === 0)) toggle(card);
      });
      if (canHover) {
        button.addEventListener("focus", () => {
          if (!fromTouch()) engage(card);
        });
        button.addEventListener("blur", () => dismiss(card));
      }
    }

    function onFrameReady(card, index) {
      if (!card.booted && index === 0) {
        card.booted = true;
        enterIdle(card);
        return;
      }
      if (settings.logic === "land" && card.mode === "holding" && index === card.hold) {
        snapFrame(card, card.hold);
        return;
      }
      warm(card, card.index + 1);
    }

    for (let order = 0; order < PEOPLE.length; order++) {
      const [name, dir, portraitFile, blurCount] = PEOPLE[order];
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "card";
      button.setAttribute("aria-label", name);
      button.setAttribute("aria-pressed", reduceMotion ? "true" : "false");
      if (reduceMotion) button.classList.add("is-revealed");

      const layerA = makeImg("frame");
      const layerB = makeImg("frame");
      const portrait = makeImg("portrait");
      button.append(layerA, layerB, portrait);
      li.append(button);
      team.append(li);

      const card = {
        order,
        root: button,
        layers: [layerA, layerB],
        front: 0,
        portrait,
        portraitSrc: `assets/${dir}/${portraitFile}`,
        portraitReady: "",
        frames: Array.from({ length: blurCount }, (_, i) => ({
          src: `assets/${dir}/blur_${i + 1}.jpg`,
          url: "",
        })),
        index: 0,
        hold: Math.floor(Math.random() * blurCount),
        mode: "fast",
        slowStep: 0,
        remaining: 0,
        booted: false,
        paused: false,
        timer: 0,
        warmer: null,
        warmed: "",
      };

      if (reduceMotion) assign(portrait, card.portraitSrc);
      bind(card);
      cards.push(card);
    }

    const jobs = [];
    let running = 0;

    function enqueue(job) {
      jobs.push(job);
      drain();
    }

    function drain() {
      while (running < 2 && jobs.length) {
        const job = jobs.shift();
        running += 1;
        job()
          .catch(() => {})
          .finally(() => {
            running -= 1;
            setTimeout(drain, 0);
          });
      }
    }

    async function scaledUrl(src, width) {
      try {
        const response = await fetch(src, { cache: "no-cache" });
        if (!response.ok) return src;
        const bitmap = await createImageBitmap(await response.blob(), {
          resizeWidth: width,
          resizeQuality: width > 1000 ? "high" : "medium",
        });
        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.drawImage(bitmap, 0, 0);
        bitmap.close();
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", width > 1000 ? 0.9 : 0.82));
        canvas.width = 0;
        canvas.height = 0;
        return blob ? URL.createObjectURL(blob) : src;
      } catch {
        return src;
      }
    }

    function queueBlur(card, n) {
      enqueue(async () => {
        const frame = card.frames[n];
        frame.url = await scaledUrl(frame.src, BLUR_W);
        onFrameReady(card, n);
      });
    }

    for (const card of cards) queueBlur(card, 0);
    for (const card of cards) if (card.frames[1]) queueBlur(card, 1);

    for (const card of cards) {
      enqueue(async () => {
        card.portraitReady = await scaledUrl(card.portraitSrc, PORTRAIT_W);
        if (card.mode === "revealed" || reduceMotion) assign(card.portrait, card.portraitReady);
      });
    }

    const blurDepth = Math.max(...cards.map((card) => card.frames.length));
    for (let n = 2; n < blurDepth; n++) {
      for (const card of cards) {
        if (n < card.frames.length) queueBlur(card, n);
      }
    }

    document.addEventListener("visibilitychange", () => {
      const hidden = document.hidden;
      for (const card of cards) {
        card.paused = hidden;
        if (hidden) stop(card);
        else if (!reduceMotion && card.mode === "running" && settings.logic === "land") queueLand(card);
        else if (!reduceMotion && (card.mode === "fast" || card.mode === "running" || card.mode === "slowing")) {
          later(card, FAST, () => step(card));
        }
      }
    });

    const hudPanel = document.getElementById("hud-panel");
    const hudToggle = document.getElementById("hud-toggle");
    const blurControl = document.getElementById("blur-control");
    const blurReadout = document.getElementById("blur-readout");

    hudToggle.addEventListener("click", () => {
      const open = hudPanel.hasAttribute("hidden");
      hudPanel.toggleAttribute("hidden", !open);
      hudToggle.setAttribute("aria-expanded", open ? "true" : "false");
      hudToggle.textContent = open ? "Close" : "Controls";
    });

    function applyBlur(value) {
      const next = Math.max(0, Math.min(40, value));
      settings.blur = next;
      blurForLogic[settings.logic] = next;
      document.documentElement.style.setProperty("--blur", next + "px");
      blurControl.value = String(next);
      blurReadout.textContent = next + "px";
      blurControl.setAttribute("aria-valuenow", String(next));
    }

    blurControl.addEventListener("input", () => {
      applyBlur(Number(blurControl.value) || 0);
    });

    for (const input of document.querySelectorAll('input[name="logic"]')) {
      input.addEventListener("change", () => {
        if (!input.checked) return;
        settings.logic = input.value;
        applyBlur(blurForLogic[input.value]);
        for (const card of cards) if (card.booted) enterIdle(card);
      });
    }
  </script>
</body>
</html>
