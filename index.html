<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team</title>
  <style>
    :root {
      --wall: #161616;
      --blur: 0px;
      --fade: 250ms;
      --fade-scale: 1;
      --fast: 250ms;
      --gap: 8px;
      --col-min: 148px;
      --cols: 5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--wall);
      color: #f2f2f2;
    }

    body {
      padding: clamp(8px, 1.4vw, 18px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .team {
      --gaps: calc((var(--cols) - 1) * var(--gap));
      --col-max: calc((100% - var(--gaps)) / var(--cols));
      display: grid;
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
      gap: var(--gap);
      grid-template-columns: repeat(auto-fill, minmax(max(var(--col-min), var(--col-max)), 1fr));
    }

    .team > li { min-width: 0; }

    .card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      padding: 0;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: #222;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .card:focus { outline: none; }

    .card:focus-visible {
      outline: 2px solid #f2f2f2;
      outline-offset: 3px;
    }

    .frame,
    .portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    .frame {
      opacity: 0;
      z-index: 0;
      filter: blur(var(--blur));
    }

    .frame.is-under {
      opacity: 1;
      z-index: 0;
      filter: blur(0);
      transition: none;
    }

    .frame.is-on {
      opacity: 1;
      z-index: 1;
      filter: blur(0);
    }

    .frame.is-out {
      opacity: 0;
      z-index: 2;
      filter: blur(var(--blur));
    }

    .card.is-live .frame.is-on,
    .card.is-live .frame.is-out {
      transition:
        opacity calc(var(--swap, var(--fast)) * 0.62 * var(--fade-scale)) linear,
        filter calc(var(--swap, var(--fast)) * 0.62 * var(--fade-scale)) ease-out;
    }

    .portrait {
      z-index: 3;
      opacity: 0;
      filter: blur(var(--blur));
      transition: opacity var(--fade) ease, filter var(--fade) ease;
    }

    .card.is-revealed .frame.is-on,
    .card.is-revealed .frame.is-under {
      opacity: 1;
      filter: blur(0);
      transition: none;
    }

    .card.is-revealed .portrait {
      opacity: 1;
      filter: blur(0);
    }

    .card.is-portrait-in .portrait {
      transition-duration: 400ms;
    }

    .hud {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      font: 13px/1.35 ui-sans-serif, system-ui, sans-serif;
      color: #f2f2f2;
    }

    .hud-panel {
      width: min(280px, calc(100vw - 28px));
      padding: 14px;
      background: #161616;
      border: 1px solid #3a3a3a;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .hud-panel[hidden] { display: none; }

    .hud-field {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      align-items: center;
    }

    .hud-field + .hud-field { margin-top: 12px; }

    .hud-field input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      margin: 0;
      accent-color: #f2f2f2;
    }

    .hud-value {
      font-variant-numeric: tabular-nums;
      color: #f2f2f2;
    }

    .hud-logic {
      margin: 14px 0 0;
      padding: 0;
      border: 0;
    }

    .hud-logic legend {
      padding: 0;
      margin-bottom: 8px;
      color: #c8c8c8;
    }

    .hud-logic label {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 0 0 8px;
      cursor: pointer;
    }

    .hud-logic label:last-child { margin-bottom: 0; }

    .hud-logic input { margin-top: 2px; accent-color: #f2f2f2; }

    .hud-toggle {
      border: 1px solid #3a3a3a;
      background: #161616;
      color: #f2f2f2;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    .hud-toggle:focus-visible,
    .hud-panel input:focus-visible {
      outline: 2px solid #f2f2f2;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .frame { display: none; }
      .portrait,
      .card.is-revealed .portrait {
        opacity: 1;
        filter: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Team</h1>
  <ul class="team" id="team"></ul>
  <div class="hud">
    <div class="hud-panel" id="hud-panel" hidden>
      <label class="hud-field">
        <span>Blur transition</span>
        <span class="hud-value" id="blur-readout">0px</span>
        <input id="blur-control" type="range" min="0" max="40" step="1" value="0" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0">
      </label>
      <label class="hud-field">
        <span>Fade</span>
        <span class="hud-value" id="fade-readout">250ms</span>
        <input id="fade-control" type="range" min="0" max="600" step="10" value="250" aria-valuemin="0" aria-valuemax="600" aria-valuenow="250">
      </label>
      <label class="hud-field">
        <span>Animation speed</span>
        <span class="hud-value" id="speed-readout">80%</span>
        <input id="speed-control" type="range" min="25" max="300" step="5" value="80" aria-valuemin="25" aria-valuemax="300" aria-valuenow="80">
      </label>
      <fieldset class="hud-logic">
        <legend>Logic</legend>
        <label>
          <input type="radio" name="logic" value="land">
          <span>One random blur, then run to the portrait</span>
        </label>
        <label>
          <input type="radio" name="logic" value="play">
          <span>Portrait first, blur sequence on hover</span>
        </label>
        <label>
          <input type="radio" name="logic" value="reveal" checked>
          <span>Blur sequence, then reveal the portrait</span>
        </label>
      </fieldset>
    </div>
    <button class="hud-toggle" id="hud-toggle" type="button" aria-expanded="false" aria-controls="hud-panel">Controls</button>
  </div>
  <script>
    const FAST = 200;
    const LAND_BUDGET = 460;

    const settings = { blur: 0, fade: 250, speed: 80, logic: "reveal" };
    const blurForLogic = { land: 0, play: 0, reveal: 0 };
    const fadeForLogic = { land: 250, play: 250, reveal: 250 };
    const speedForLogic = { land: 80, play: 80, reveal: 80 };

    function scaled(ms) {
      return Math.max(16, Math.round(ms / (settings.speed / 100)));
    }

    // Primary still is portrait.jpg. Some folders spell that file portait.jpg.
    const PEOPLE = [
      ["Alex", "alex", "portrait.jpg", 8],
      ["Alica", "alica", "portait.jpg", 6],
      ["Chiara", "chiara", "portrait.jpg", 14],
      ["Esa", "esa", "portrait.jpg", 10],
      ["Jesus", "jesus", "portrait.jpg", 12],
      ["Mantas", "mantas", "portrait.jpg", 9],
      ["Marion", "marion", "portait.jpg", 13],
      ["Milan B", "milan_b", "portait.jpg", 16],
      ["Milan V", "milan_v", "portait.jpg", 13],
    ];

    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
    const team = document.getElementById("team");
    const cards = [];

    function makeImg(className) {
      const img = document.createElement("img");
      img.className = className;
      img.alt = "";
      img.draggable = false;
      img.decoding = "async";
      return img;
    }

    function later(card, delay, fn) {
      clearTimeout(card.timer);
      card.timer = setTimeout(fn, delay);
    }

    function stop(card) {
      clearTimeout(card.timer);
      card.timer = 0;
    }

    function finishSwap(card, prev, next, gen) {
      if (card.swapGen !== gen) return;
      prev.img.classList.remove("is-out");
      next.img.classList.remove("is-under");
      next.img.classList.add("is-on");
    }

    function showFrame(card, index) {
      const next = card.frames[index];
      if (!next?.ready) return false;
      const prev = card.frames[card.index];
      const prevVisible = prev && (prev.img.classList.contains("is-on") || prev.img.classList.contains("is-under"));
      if (!prevVisible || prev === next) return snapFrame(card, index);
      for (const frame of card.frames) {
        if (frame !== prev && frame !== next) frame.img.classList.remove("is-on", "is-under", "is-out");
      }
      next.img.classList.remove("is-out", "is-on");
      next.img.classList.add("is-under");
      void next.img.offsetWidth;
      prev.img.classList.remove("is-on", "is-under");
      prev.img.classList.add("is-out");
      card.index = index;
      const gen = ++card.swapGen;
      const duration = card.root.classList.contains("is-live")
        ? (parseFloat(getComputedStyle(prev.img).transitionDuration) || 0)
        : 0;
      if (duration === 0) {
        finishSwap(card, prev, next, gen);
        return true;
      }
      prev.img.addEventListener("transitionend", function onEnd(event) {
        if (event.propertyName !== "opacity") return;
        prev.img.removeEventListener("transitionend", onEnd);
        finishSwap(card, prev, next, gen);
      });
      setTimeout(() => finishSwap(card, prev, next, gen), duration * 1000 + 40);
      return true;
    }

    function snapFrame(card, index) {
      const frame = card.frames[index];
      if (!frame?.ready) return false;
      card.root.classList.remove("is-live");
      card.swapGen += 1;
      for (const item of card.frames) item.img.classList.remove("is-on", "is-under", "is-out");
      frame.img.classList.add("is-on");
      card.index = index;
      requestAnimationFrame(() => card.root.classList.add("is-live"));
      return true;
    }

    function showPortrait(card) {
      card.mode = "revealed";
      card.root.classList.add("is-revealed");
      card.root.setAttribute("aria-pressed", "true");
    }

    function hidePortrait(card) {
      card.root.classList.remove("is-revealed");
      card.root.setAttribute("aria-pressed", "false");
    }

    function isIdle(card) {
      if (settings.logic === "play") return card.mode === "revealed";
      if (settings.logic === "land") return card.mode === "holding";
      return card.mode === "fast";
    }

    function step(card) {
      if (card.paused || card.mode === "revealed" || card.mode === "holding" || settings.logic === "land") return;

      const nextIndex = (card.index + 1) % card.frames.length;
      if (!card.frames[nextIndex].ready) {
        later(card, 16, () => step(card));
        return;
      }

      const delay = scaled(FAST);
      card.root.style.setProperty("--swap", delay + "ms");
      if (!showFrame(card, nextIndex)) {
        later(card, 16, () => step(card));
        return;
      }
      later(card, delay, () => step(card));
    }

    function queueLand(card) {
      if (card.paused || card.mode !== "running" || settings.logic !== "land") return;
      const count = card.frames.length;
      const budget = card.landBudget;
      if (card.landCursor >= count) {
        later(card, Math.max(0, card.landStart + budget - performance.now()), () => {
          if (card.mode === "running" && settings.logic === "land") showPortrait(card);
        });
        return;
      }
      const when = card.landStart + Math.round((card.landCursor * budget) / count);
      later(card, Math.max(0, when - performance.now()), () => advanceLand(card));
    }

    function advanceLand(card) {
      if (card.paused || card.mode !== "running" || settings.logic !== "land") return;
      const count = card.frames.length;
      const budget = card.landBudget;
      if (card.landCursor >= count || performance.now() >= card.landStart + budget) {
        showPortrait(card);
        return;
      }
      const nextIndex = (card.index + 1) % count;
      if (!card.frames[nextIndex].ready) {
        if (performance.now() >= card.landStart + budget) showPortrait(card);
        else later(card, 16, () => advanceLand(card));
        return;
      }
      card.root.style.setProperty("--swap", Math.max(16, Math.round(budget / count)) + "ms");
      if (!showFrame(card, nextIndex)) {
        later(card, 16, () => advanceLand(card));
        return;
      }
      card.landCursor += 1;
      queueLand(card);
    }

    function ensureCycle(card, stagger) {
      if (card.paused) return;
      if (card.mode !== "fast" && card.mode !== "running") return;
      if (!card.frames[card.index]?.ready) {
        const fallback = card.frames.findIndex((frame) => frame.ready);
        if (fallback >= 0) card.index = fallback;
        else {
          later(card, 16, () => ensureCycle(card, stagger));
          return;
        }
      }
      const visible = card.frames[card.index].img;
      if (!visible.classList.contains("is-on") && !visible.classList.contains("is-under")) snapFrame(card, card.index);
      if (!card.timer) {
        const interval = scaled(FAST);
        const span = Math.max(1, interval - 30);
        const delay = stagger ? interval - ((card.order * 53) % span) : interval;
        later(card, delay, () => step(card));
      }
    }

    function enterIdle(card) {
      stop(card);
      card.root.classList.remove("is-portrait-in");
      card.remaining = 0;
      if (reduceMotion || settings.logic === "play") {
        showPortrait(card);
        return;
      }
      hidePortrait(card);
      if (settings.logic === "land") {
        card.mode = "holding";
        card.index = card.hold;
        if (card.frames[card.hold]?.ready) snapFrame(card, card.hold);
        return;
      }
      card.mode = "fast";
      ensureCycle(card, true);
    }

    function engage(card) {
      if (reduceMotion || !isIdle(card)) return;
      if (settings.logic === "reveal") {
        stop(card);
        card.root.classList.add("is-portrait-in");
        showPortrait(card);
        return;
      }
      if (settings.logic === "play") {
        card.mode = "running";
        const start = () => {
          if (card.mode !== "running" || settings.logic !== "play") return;
          const readyIndex = card.frames[card.index]?.ready
            ? card.index
            : card.frames.findIndex((frame) => frame.ready);
          if (readyIndex < 0) {
            later(card, 16, start);
            return;
          }
          card.index = readyIndex;
          snapFrame(card, readyIndex);
          hidePortrait(card);
          ensureCycle(card, false);
        };
        start();
        return;
      }
      card.mode = "running";
      card.landCursor = 0;
      card.landBudget = scaled(LAND_BUDGET);
      card.landStart = performance.now();
      queueLand(card);
    }

    function dismiss(card) {
      if (reduceMotion || isIdle(card)) return;
      if (settings.logic === "reveal") {
        card.mode = "fast";
        card.root.classList.remove("is-portrait-in");
        hidePortrait(card);
        card.root.style.setProperty("--swap", scaled(FAST) + "ms");
        if (!card.paused) later(card, scaled(FAST), () => step(card));
        return;
      }
      enterIdle(card);
    }

    function toggle(card) {
      if (isIdle(card)) engage(card);
      else dismiss(card);
    }

    function bind(card) {
      const button = card.root;
      if (reduceMotion) return;
      let lastTouch = 0;
      const fromTouch = () => performance.now() - lastTouch < 800;

      button.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") lastTouch = performance.now();
      });
      button.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "touch" || fromTouch()) return;
        engage(card);
      });
      button.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "touch" || fromTouch()) return;
        if (button.matches(":focus-visible")) return;
        dismiss(card);
      });
      button.addEventListener("click", (event) => {
        if (fromTouch() || (!canHover && event.detail === 0)) toggle(card);
      });
      if (canHover) {
        button.addEventListener("focus", () => {
          if (!fromTouch()) engage(card);
        });
        button.addEventListener("blur", () => dismiss(card));
      }
    }

    function tryBoot(card) {
      if (card.booted || reduceMotion) return;
      if (settings.logic === "play") {
        if (!card.portraitReady) return;
      } else if (settings.logic === "land") {
        if (!card.frames[card.hold]?.ready) return;
      } else if (!card.frames[0]?.ready) {
        return;
      }
      card.booted = true;
      enterIdle(card);
    }

    for (let order = 0; order < PEOPLE.length; order++) {
      const [name, dir, portraitFile, blurCount] = PEOPLE[order];
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "card";
      button.setAttribute("aria-label", name);
      button.setAttribute("aria-pressed", reduceMotion ? "true" : "false");
      if (reduceMotion) button.classList.add("is-revealed");

      const portrait = makeImg("portrait");
      const frames = Array.from({ length: blurCount }, (_, i) => {
        const img = makeImg("frame");
        return { src: `assets/${dir}/blur_${i + 1}.jpg`, img, ready: false, started: false };
      });
      button.append(...frames.map((frame) => frame.img), portrait);
      li.append(button);
      team.append(li);

      const card = {
        order,
        root: button,
        portrait,
        portraitSrc: `assets/${dir}/${portraitFile}`,
        portraitReady: false,
        frames,
        index: 0,
        hold: Math.floor(Math.random() * blurCount),
        mode: "fast",
        landBudget: scaled(LAND_BUDGET),
        swapGen: 0,
        remaining: 0,
        booted: false,
        paused: false,
        timer: 0,
      };

      if (reduceMotion) {
        portrait.src = card.portraitSrc;
        button.classList.add("is-revealed");
      }
      bind(card);
      cards.push(card);
    }

    function watchFrame(card, index) {
      const frame = card.frames[index];
      if (frame.started) return;
      frame.started = true;
      frame.img.src = frame.src;
      frame.img.decode().then(() => {
        frame.ready = true;
        tryBoot(card);
        if (settings.logic === "land" && card.mode === "holding" && index === card.hold) snapFrame(card, card.hold);
      }).catch(() => {});
    }

    function watchPortrait(card) {
      card.portrait.src = card.portraitSrc;
      card.portrait.decode().then(() => {
        card.portraitReady = true;
        tryBoot(card);
      }).catch(() => {});
    }

    for (const card of cards) {
      card.portrait.fetchPriority = "high";
      card.frames[card.hold].img.fetchPriority = "high";
      watchPortrait(card);
      watchFrame(card, card.hold);
    }

    setTimeout(() => {
      for (const card of cards) {
        card.frames.forEach((_, index) => watchFrame(card, index));
      }
    }, 0);

    document.addEventListener("visibilitychange", () => {
      const hidden = document.hidden;
      for (const card of cards) {
        card.paused = hidden;
        if (hidden) stop(card);
        else if (!reduceMotion && card.mode === "running" && settings.logic === "land") queueLand(card);
        else if (!reduceMotion && (card.mode === "fast" || card.mode === "running")) {
          later(card, scaled(FAST), () => step(card));
        }
      }
    });

    const hudPanel = document.getElementById("hud-panel");
    const hudToggle = document.getElementById("hud-toggle");
    const blurControl = document.getElementById("blur-control");
    const blurReadout = document.getElementById("blur-readout");
    const fadeControl = document.getElementById("fade-control");
    const fadeReadout = document.getElementById("fade-readout");
    const speedControl = document.getElementById("speed-control");
    const speedReadout = document.getElementById("speed-readout");

    hudToggle.addEventListener("click", () => {
      const open = hudPanel.hasAttribute("hidden");
      hudPanel.toggleAttribute("hidden", !open);
      hudToggle.setAttribute("aria-expanded", open ? "true" : "false");
      hudToggle.textContent = open ? "Close" : "Controls";
    });

    function applyBlur(value) {
      const next = Math.max(0, Math.min(40, value));
      settings.blur = next;
      blurForLogic[settings.logic] = next;
      document.documentElement.style.setProperty("--blur", next + "px");
      blurControl.value = String(next);
      blurReadout.textContent = next + "px";
      blurControl.setAttribute("aria-valuenow", String(next));
    }

    function applyFade(value) {
      const next = Math.max(0, Math.min(600, value));
      settings.fade = next;
      fadeForLogic[settings.logic] = next;
      document.documentElement.style.setProperty("--fade", next + "ms");
      document.documentElement.style.setProperty("--fade-scale", String(next / 250));
      fadeControl.value = String(next);
      fadeReadout.textContent = next + "ms";
      fadeControl.setAttribute("aria-valuenow", String(next));
    }

    function applySpeed(value) {
      const next = Math.max(25, Math.min(300, Math.round(value)));
      settings.speed = next;
      speedForLogic[settings.logic] = next;
      document.documentElement.style.setProperty("--fast", scaled(FAST) + "ms");
      speedControl.value = String(next);
      speedReadout.textContent = next + "%";
      speedControl.setAttribute("aria-valuenow", String(next));
    }

    function rememberControls() {
      applyBlur(blurForLogic[settings.logic]);
      applyFade(fadeForLogic[settings.logic]);
      applySpeed(speedForLogic[settings.logic]);
    }

    blurControl.addEventListener("input", () => {
      applyBlur(Number(blurControl.value) || 0);
    });

    fadeControl.addEventListener("input", () => {
      applyFade(Number(fadeControl.value) || 0);
    });

    speedControl.addEventListener("input", () => {
      applySpeed(Number(speedControl.value) || 80);
      for (const card of cards) {
        if (card.paused || !card.timer) continue;
        const cycling = (settings.logic === "reveal" && card.mode === "fast")
          || (settings.logic === "play" && card.mode === "running");
        if (cycling) later(card, scaled(FAST), () => step(card));
      }
    });

    for (const input of document.querySelectorAll('input[name="logic"]')) {
      input.addEventListener("change", () => {
        if (!input.checked) return;
        settings.logic = input.value;
        rememberControls();
        for (const card of cards) {
          if (card.booted) enterIdle(card);
          else tryBoot(card);
        }
      });
    }

    rememberControls();
  </script>
</body>
</html>
